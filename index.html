  <main class="main">

    <div class="main__body">

      <div class="main__img">
        <img class="main__img-image" src="tjr.jpg" alt="">
      </div>

      <div class="main__title">
       <p><strong>The Justice Report</strong> пояснює складне та розбирає кожну новину.</p>

      </div>

      <div class="main__description">
          <br>
Тебе тримають на гачку новин: страшний заголовок, клік, а всередині нічого нового, тільки тривога. TJR працює навпаки.

      <div class="tgme_page_action main__button">
        <button class="tgme_action_button_new shine" style="cursor: pointer;" onclick="handleTelegramButtonClick()">
          Перейти в канал
        </button>
      </div>
  <script>
      function getCookie(name) {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      }

      function handleTelegramButtonClick() {
        var payload = JSON.stringify({
          url: window.location.href,
          fbp: getCookie('_fbp'),
          fbc: getCookie('_fbc')
        });

        // Надсилання події в Conversion API через Vercel Serverless Function
        fetch('/api/send-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true
        }).catch(function () {});

        // Затримка, щоб запит встиг відправитись
        setTimeout(function () {
          window.location.href = 'https://t.me/+1dWy21yliNMyOTNi';
        }, 300);
      }
  </script>
